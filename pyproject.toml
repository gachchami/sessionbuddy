[project]
name = "sessionbuddy"
version = "0.1.0"
description = "Performance-first event program management on Cloudflare Python Workers"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  # Must match the pydantic-core WebAssembly wheel shipped by Pyodide 0.28.3.
  "pydantic==2.10.6",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "workers-py",
  "workers-runtime-sdk",
]
# Only needed to regenerate assets/logo derivatives; not required to run or test
# the application. See scripts/build_logo_assets.py.
logo = [
  "cairosvg>=2.7,<3",
  "pillow>=10,<12",
]
fixture-assets = [
  "pillow>=10,<12",
  "reportlab>=4.4,<5",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["harness", "python_modules", ".venv-workers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
