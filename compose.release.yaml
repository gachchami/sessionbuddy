services:
  mailpit:
    # The release project reaches Mailpit over the Compose network. Publishing
    # its UI would collide with an ordinary local stack on port 8025.
    ports: !reset []

  worker:
    ports: !reset []
    # The gate is a hermetic local rehearsal. Depending on `tunnel-vars` would
    # make it require internet and a live quick tunnel, and would let the gate
    # rewrite the developer's real .dev.vars as a side effect. `!override`
    # replaces the mapping instead of merging into it, so the tunnel services
    # are never started for this project.
    depends_on: !override
      scanner:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      activity-poller:
        condition: service_started
    environment:
      RELEASE_GATE_STATE: ${RELEASE_GATE_STATE:?set by scripts/release_gate.sh}
    command:
      - npm
      - run
      - worker:dev
      - --
      - --ip
      - 0.0.0.0
      - --port
      - "8787"
      - --persist-to
      - /workspace/${RELEASE_GATE_STATE:?set by scripts/release_gate.sh}

  activity-worker:
    ports: !reset []
    command:
      - npm
      - run
      - activity:dev
      - --
      - --ip
      - 0.0.0.0
      - --port
      - "8788"
      - --persist-to
      - /workspace/${RELEASE_GATE_STATE:?set by scripts/release_gate.sh}

volumes:
  # Reuse only Wrangler's authenticated CLI configuration. Application state
  # remains isolated in RELEASE_GATE_STATE and no deployment is performed.
  wrangler-config:
    external: true
    name: sessionbuddy_wrangler-config
