<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submissions · SessionBuddy</title>
  <link rel="stylesheet" href="/product/assets/product.css?v=11">
  <link rel="stylesheet" href="/app-shell/assets/app-shell.css?v=3">
  <script src="/app-shell/assets/app-shell.js?v=4" defer></script>
  <script src="/product/assets/admin-submissions.js?v=5" defer></script>
</head>
<body class="app-body">
  <a class="skip-link" href="#main">Skip to submissions</a>
  <header data-auth-shell></header>
  <main id="main" class="shell page" tabindex="-1">
    <h1>Submissions</h1>
    <div id="status" class="status" role="status" aria-live="polite">Checking your session…</div>
    <section class="card"><p>Select the submissions to include in the next round.</p><div class="table-scroll"><table><thead><tr><th>Include</th><th>Speaker</th><th>Proposal</th><th>Abstract</th><th>Status</th></tr></thead><tbody id="submissions"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section>
    <section class="card"><h2>Evaluation round</h2><form id="round-form"><fieldset id="round-fields"><label>Round name<input name="name" value="Initial review" required maxlength="200"></label><div class="form-grid"><label>Minimum rating<input name="rating_min" type="number" value="1" min="0" max="9" required></label><label>Maximum rating<input name="rating_max" type="number" value="5" min="1" max="10" required></label></div><label>Recommendations<input name="recommendations" value="strong_accept, accept, reject, strong_reject" required><small>Comma-separated, with at least two unique choices.</small></label><label>Reviewer guidance<textarea name="evaluator_guidance" rows="3">Score the proposal itself. Do not include speaker identity or reputation in the rating.</textarea></label><label>Assignment strategy<select name="assignment_strategy"><option value="balanced">Balanced — distribute submissions evenly</option><option value="all">All — every reviewer reviews every submission</option></select></label><fieldset><legend>Reviewers</legend><div id="evaluators">Loading reviewers…</div></fieldset><button id="open-round" disabled>Open evaluation round</button></fieldset></form><a class="button secondary" href="/reviews">Open reviews</a><div id="round-result" class="public-link"></div></section>
  </main>
</body>
</html>
