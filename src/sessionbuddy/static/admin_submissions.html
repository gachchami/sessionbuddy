<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Submissions · SessionBuddy</title><link rel="stylesheet" href="/product/assets/product.css?v=4"><script src="/product/assets/admin-submissions.js?v=4" defer></script></head><body><header><div class="shell"><strong>SessionBuddy</strong><a href="/admin/programs">Programs</a></div></header><main class="shell"><p class="eyebrow">Program management</p><h1>Submissions</h1><div id="status" class="status" role="status" aria-live="polite">Checking your session…</div><section class="card"><p>Select the submissions to include in the next round.</p><div class="table-scroll"><table><thead><tr><th>Include</th><th>Speaker</th><th>Proposal</th><th>Abstract</th><th>Status</th></tr></thead><tbody id="submissions"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section><section class="card"><p class="eyebrow">Wave 2 · Evaluation</p><h2>Configure evaluation round</h2><form id="round-form"><fieldset id="round-fields"><label>Round name<input name="name" value="Initial review" required maxlength="200"></label><div class="form-grid"><label>Minimum rating<input name="rating_min" type="number" value="1" min="0" max="9" required></label><label>Maximum rating<input name="rating_max" type="number" value="5" min="1" max="10" required></label></div><label>Recommendations<input name="recommendations" value="strong_accept, accept, reject, strong_reject" required><small>Comma-separated, with at least two unique choices.</small></label><label>Evaluator guidance<textarea name="evaluator_guidance" rows="3">Score the proposal itself. Do not include speaker identity or reputation in the rating.</textarea></label><label>Assignment strategy<select name="assignment_strategy"><option value="balanced">Balanced — distribute submissions evenly</option><option value="all">All — every evaluator reviews every submission</option></select></label><fieldset><legend>Evaluators</legend><div id="evaluators">Loading evaluators…</div></fieldset><button id="open-round" disabled>Open evaluation round</button></fieldset></form><a class="button secondary" href="/reviews">Go to review workspace</a><div id="round-result" class="public-link"></div></section></main></body></html>
