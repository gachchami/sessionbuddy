<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · SessionBuddy</title>
  <link rel="stylesheet" href="/product/assets/product.css?v=15">
  <link rel="stylesheet" href="/app-shell/assets/app-shell.css?v=7">
  <script src="/app-shell/assets/api-client.js?v=1" defer></script>
  <script src="/app-shell/assets/app-shell.js?v=8" defer></script>
  <script src="/account/assets/account.js?v=3" defer></script>
</head>
<body class="app-body">
  <a class="skip-link" href="#main">Skip to account</a>
  <header data-auth-shell></header>
  <main id="main" class="shell page account-page" tabindex="-1">
    <div class="page-heading"><div><h1>Account</h1><p class="lede">Profile details and access.</p></div></div>
    <div id="status" class="status status-compact" role="status" aria-live="polite">Loading…</div>
    <section class="card" aria-labelledby="profile-title">
      <h2 id="profile-title">Profile</h2>
      <form id="profile-form">
        <div class="form-grid">
          <label>Full name<input name="display_name" autocomplete="name" maxlength="200" required></label>
          <label>Sign-in email<input id="account-email" type="email" autocomplete="email" disabled></label>
          <label>Job title <span class="optional">Optional</span><input name="job_title" autocomplete="organization-title" maxlength="200"></label>
          <label>Company or team <span class="optional">Optional</span><input name="company" autocomplete="organization" maxlength="200"></label>
          <label>Time zone <span class="optional">Optional</span><input name="time_zone" maxlength="100" placeholder="Asia/Kolkata"></label>
        </div>
        <p class="help">The email is your verified sign-in identity and cannot be changed here.</p>
        <button id="save-profile" type="submit" disabled>Save profile</button>
      </form>
    </section>
    <section class="directory-section" aria-labelledby="access-title">
      <div class="section-heading"><h2 id="access-title">Access</h2><span id="access-count" class="badge">—</span></div>
      <div id="access-list" class="entity-grid"><p class="empty">Loading access…</p></div>
    </section>
  </main>
</body>
</html>
