<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organizer workspace · SessionBuddy</title>
  <link rel="stylesheet" href="/product/assets/product.css?v=112">
  <link rel="stylesheet" href="/app-shell/assets/app-shell.css?v=38">
  <link rel="stylesheet" href="/admin/home/assets/home.css?v=f158d9d5fc8c">
  <script src="/app-shell/assets/api-client.js?v=12" defer></script>
  <script src="/app-shell/assets/app-shell.js?v=45" defer></script>
  <script src="/app-shell/assets/activity-format.js?v=83538309eb69" defer></script>
  <script src="/admin/home/assets/home.js?v=2b58c0cd52f7" defer></script>
</head>
<body class="app-body organizer-page organizer-page--home">
  <!-- Home owns organization identity; Events owns the filtered result count.
  Keep switching, permissions, and action destinations independent of layout. -->
  <a class="skip-link" href="#events">Skip to events</a>
  <header data-auth-shell></header>

  <main id="main" class="shell page organizer-main" tabindex="-1">
      <div id="workspace-heading" class="organizer-home-heading__identity">
        <h1 id="workspace-title">Your workspace</h1>
        <p id="workspace-summary">Loading your organizations…</p>
      </div>
    <p id="status" class="status status-compact organizer-home-status" role="status" aria-live="polite">Loading your workspace…</p>

    <div class="organizer-home-grid">
      <aside id="organization-rail" class="organizer-home-organizations" aria-labelledby="organizations-title" hidden>
        <form id="organization-search-form" class="organizer-home-organization-search" role="search">
          <label for="organization-search">Find organization</label>
          <input id="organization-search" type="search" maxlength="100" autocomplete="off" placeholder="Find organization">
        </form>
        <div class="organizer-home-organizations__heading">
          <h2 id="organizations-title">All organizations</h2>
          <span id="organization-count" class="organizer-home-count"></span>
        </div>
        <nav id="organization-list" class="organizer-home-organization-list" aria-label="Organizations"></nav>
      </aside>
      <section id="events" class="organizer-home-events" aria-labelledby="events-title" tabindex="-1">
        <div class="organizer-home-events__heading">
          <div class="organizer-home-events__identity">
            <h2 id="events-title" tabindex="-1">Events</h2>
            <p><span id="event-count" class="organizer-home-count" aria-live="polite"></span></p>
          </div>
          <div class="organizer-home-heading">
            <label id="organization-picker-label" class="organizer-home-organization-picker" hidden>
              <span>Switch organization</span>
              <select id="organization-picker"></select>
            </label>
            <div class="actions organizer-home-page-actions">
              <a id="organization-settings" class="button secondary" href="/admin/organization">Organization settings</a>
              <a id="new-event" class="button" href="/admin/events/new" hidden>Create event</a>
            </div>
          </div>
        </div>
        <div class="organizer-home-toolbar">
          <div class="organizer-home-filters" aria-label="Filter events">
            <span class="organizer-home-filter-label">Status</span>
            <div class="organizer-home-filter-options">
              <button type="button" class="organizer-home-filter" data-event-filter="all" aria-pressed="true">All</button>
              <button type="button" class="organizer-home-filter" data-event-filter="active" aria-pressed="false">Active</button>
              <button type="button" class="organizer-home-filter" data-event-filter="draft" aria-pressed="false">Drafts</button>
              <button type="button" class="organizer-home-filter" data-event-filter="past" aria-pressed="false">Past</button>
            </div>
          </div>
          <form id="event-search-form" class="organizer-home-search" role="search">
            <label for="event-search">Search</label>
            <input id="event-search" name="q" type="search" maxlength="100" autocomplete="off" placeholder="Name or location">
          </form>
          <details class="organizer-home-sort-disclosure" id="sort-disclosure" open>
          <summary>Sort options</summary>
          <label class="organizer-home-sort" for="event-sort">
            <span>Sort</span>
            <select id="event-sort">
              <option value="upcoming">Upcoming first</option>
              <option value="recent">Newest first</option>
            </select>
          </label>
          </details>
        </div>
        <nav id="event-month-nav" class="organizer-home-month-nav" aria-label="Jump to month" hidden></nav>
        <div id="event-table" class="organizer-home-table" role="table" aria-label="Events" aria-busy="true">
          <div class="organizer-home-table__header" role="rowgroup">
            <div role="row">
              <span id="event-column-event" role="columnheader">Event</span>
              <span id="event-column-status" role="columnheader">Location</span>
              <span id="event-column-date" role="columnheader">Dates</span>
              <span id="event-column-program" role="columnheader">Progress</span>
              <span id="event-column-actions" role="columnheader">Actions</span>
            </div>
          </div>

          <div id="event-list" class="organizer-home-table__body" role="rowgroup"><div class="organizer-home-month organizer-home-month--skeleton" aria-hidden="true"><div class="organizer-home-month__label"><span class="sb-skeleton sb-skeleton--text"></span></div><div class="organizer-home-month__rows"><div class="organizer-home-event-row organizer-home-event-row--skeleton"><div class="organizer-home-event-date"><span class="sb-skeleton sb-skeleton--text"></span></div><div class="organizer-home-event-identity"><span class="sb-skeleton sb-skeleton--title"></span><span class="sb-skeleton sb-skeleton--text"></span></div><div class="organizer-home-event-actions"><span class="sb-skeleton sb-skeleton--button"></span></div></div><div class="organizer-home-event-row organizer-home-event-row--skeleton"><div class="organizer-home-event-date"><span class="sb-skeleton sb-skeleton--text"></span></div><div class="organizer-home-event-identity"><span class="sb-skeleton sb-skeleton--title"></span><span class="sb-skeleton sb-skeleton--text"></span></div><div class="organizer-home-event-actions"><span class="sb-skeleton sb-skeleton--button"></span></div></div><div class="organizer-home-event-row organizer-home-event-row--skeleton"><div class="organizer-home-event-date"><span class="sb-skeleton sb-skeleton--text"></span></div><div class="organizer-home-event-identity"><span class="sb-skeleton sb-skeleton--title"></span><span class="sb-skeleton sb-skeleton--text"></span></div><div class="organizer-home-event-actions"><span class="sb-skeleton sb-skeleton--button"></span></div></div></div></div></div>

        </div>
        <p id="event-list-empty" class="empty organizer-home-empty" aria-live="polite">Loading events…</p>
      </section>
      <div id="recent-changes-slot"></div>
      <div id="event-pagination" class="organizer-home-pagination">
        <button id="load-more-events" class="secondary" type="button" hidden>Load more</button>
      </div>
    </div>
  </main>

</body>
</html>
