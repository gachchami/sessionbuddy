<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · SessionBuddy</title>
  <link rel="stylesheet" href="/product/assets/product.css?v=76">
  <link rel="stylesheet" href="/app-shell/assets/app-shell.css?v=25">
  <script src="/app-shell/assets/api-client.js?v=7" defer></script>
  <script src="/app-shell/assets/app-shell.js?v=28" defer></script>
  <script src="/admin/home/assets/home.js?v=13" defer></script>
</head>
<body class="app-body organizer-page organizer-page--home">
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-auth-shell></header>
  <main id="main" class="shell page organizer-main" tabindex="-1">
    <section class="organizer-home-identity organizer-home-identity--minimal" aria-labelledby="organization-name">
      <div><h1 id="organization-name">Loading organization…</h1></div>
      <div class="actions organizer-home-actions"><a class="button secondary" href="/admin/organization">Settings</a><a id="new-event" class="button" href="/admin/events#event-form" hidden>Create event</a></div>
    </section>
    <div id="status" class="status status-compact organizer-home-status" role="status" aria-live="polite">Loading your workspace…</div>

    <section class="organizer-home-event-index" aria-labelledby="workspace-title">
      <h2 id="workspace-title" class="sr-only">Events</h2>
      <span id="event-count" class="sr-only" aria-live="polite">—</span>
      <div class="organizer-home-event-list" aria-label="Events"><p id="event-list-empty" class="empty">Loading events…</p></div>
      <div class="organizer-home-pagination"><button id="load-more-events" class="secondary" type="button" hidden>Load more</button></div>
    </section>
  </main>
</body>
</html>
