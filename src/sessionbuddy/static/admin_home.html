<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · SessionBuddy</title>
  <link rel="stylesheet" href="/product/assets/product.css?v=80">
  <link rel="stylesheet" href="/app-shell/assets/app-shell.css?v=26">
  <link rel="stylesheet" href="/admin/home/assets/home.css?v=8c5aab8925dc">
  <script src="/app-shell/assets/api-client.js?v=8" defer></script>
  <script src="/app-shell/assets/app-shell.js?v=30" defer></script>
  <script src="/app-shell/assets/activity-format.js?v=1044747b380e" defer></script>
  <script src="/admin/home/assets/home.js?v=2acf2d97edb1" defer></script>
</head>
<body class="app-body organizer-page organizer-page--home">
  <a class="skip-link" href="#events">Skip to events</a>
  <header data-auth-shell></header>
  <main id="main" class="shell page organizer-main" tabindex="-1">
    <header class="organizer-home-heading">
      <div class="organizer-home-heading__identity">
        <h1 id="organization-name">Loading organization…</h1>
        <label id="organization-picker-label" class="organizer-home-organization-picker" hidden>
          <span>Organization</span>
          <select id="organization-picker"></select>
        </label>
      </div>
      <div class="actions organizer-home-actions">
        <a id="organization-settings" class="button secondary" href="/admin/organization">Organization settings</a>
        <a id="new-event" class="button" href="/admin/events/new" hidden>Create event</a>
      </div>
    </header>
    <p id="status" class="status status-compact organizer-home-status" role="status" aria-live="polite">Loading your workspace…</p>

    <div class="organizer-home-grid">
      <section id="events" class="organizer-home-events" aria-labelledby="events-title" tabindex="-1">
        <div class="organizer-home-events__heading">
          <h2 id="events-title" tabindex="-1">Events</h2>
          <span id="event-count" class="organizer-home-count" aria-live="polite"></span>
        </div>
        <div class="organizer-home-toolbar">
          <div class="organizer-home-filters" aria-label="Filter events">
            <button type="button" class="organizer-home-filter" data-event-filter="all" aria-pressed="true">All</button>
            <button type="button" class="organizer-home-filter" data-event-filter="active" aria-pressed="false">Active</button>
            <button type="button" class="organizer-home-filter" data-event-filter="draft" aria-pressed="false">Drafts</button>
            <button type="button" class="organizer-home-filter" data-event-filter="past" aria-pressed="false">Past</button>
          </div>
          <form id="event-search-form" class="organizer-home-search" role="search">
            <label for="event-search">Search</label>
            <input id="event-search" name="q" type="search" maxlength="100" autocomplete="off" placeholder="Name or location">
          </form>
          <label class="organizer-home-sort" for="event-sort">
            <span>Sort</span>
            <select id="event-sort">
              <option value="upcoming">Upcoming first</option>
              <option value="recent">Newest first</option>
            </select>
          </label>
        </div>
        <div id="event-table" class="organizer-home-table" role="table" aria-label="Events" aria-busy="true">
          <div class="organizer-home-table__header" role="rowgroup">
            <div role="row">
              <span id="event-column-event" role="columnheader">Event</span>
              <span id="event-column-date" role="columnheader">Date</span>
              <span id="event-column-where" role="columnheader">Where</span>
              <span id="event-column-program" role="columnheader">Program</span>
              <span id="event-column-actions" role="columnheader">Actions</span>
            </div>
          </div>
          <div id="event-list" class="organizer-home-table__body" role="rowgroup"></div>
        </div>
        <p id="event-list-empty" class="empty organizer-home-empty" aria-live="polite">Loading events…</p>
      </section>
      <div id="recent-changes-slot"></div>
      <div id="event-pagination" class="organizer-home-pagination">
        <button id="load-more-events" class="secondary" type="button" hidden>Load more</button>
      </div>
    </div>
  </main>
</body>
</html>
