<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · SessionBuddy</title>
  <link rel="stylesheet" href="/product/assets/product.css?v=22">
  <link rel="stylesheet" href="/app-shell/assets/app-shell.css?v=11">
  <script src="/app-shell/assets/api-client.js?v=2" defer></script>
  <script src="/app-shell/assets/app-shell.js?v=12" defer></script>
  <script src="/admin/home/assets/home.js?v=7" defer></script>
</head>
<body class="app-body organizer-page organizer-page--home">
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-auth-shell></header>
  <main id="main" class="shell page organizer-main" tabindex="-1">
    <div class="dashboard-hero organizer-hero">
      <div class="dashboard-hero__copy"><p class="eyebrow">Dashboard</p><h1 id="dashboard-greeting">Welcome back</h1><p>Your events, speakers, and access—all in one place.</p></div>
      <a id="new-event" class="button" href="/admin/events#event-form" hidden>Create a new event</a>
      <section class="metric-strip dashboard-metrics organizer-metrics" aria-label="Workspace summary">
        <article><span>Events</span><strong id="metric-events">—</strong></article>
        <article><span>Speakers</span><strong id="metric-speakers">—</strong></article>
        <article><span>Workspace</span><strong id="metric-workspace">—</strong></article>
      </section>
    </div>
    <div id="status" class="status status-compact" role="status" aria-live="polite">Loading…</div>

    <section id="events" class="directory-section directory-section--primary organizer-section organizer-section--events" aria-labelledby="events-title">
      <div class="section-heading"><div><h2 id="events-title">Events</h2></div><a class="text-link" href="/admin/events">View all</a></div>
      <div id="event-list" class="home-event-grid"><p class="empty">Loading events…</p></div>
    </section>

    <section id="speakers" class="directory-section organizer-section organizer-section--speakers" aria-labelledby="speakers-title">
      <div class="section-heading"><div><h2 id="speakers-title">Recent speakers</h2></div><a class="text-link" href="/admin/speakers">View all</a></div>
      <div id="speaker-list" class="entity-grid"><p class="empty">Loading speakers…</p></div>
    </section>

  </main>
</body>
</html>
