<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}} · SessionBuddy</title>
  <link rel="stylesheet" href="/app-shell/assets/error-page.css?v=1">
</head>
<body class="error-page">
  <main class="error-surface">
    <a class="brand" href="/"><span class="mark" aria-hidden="true">S</span>SessionBuddy</a>
    <p class="code">{{STATUS}}</p>
    <h1>{{HEADING}}</h1>
    <p>{{MESSAGE}}</p>
    <div class="actions">
      <a class="button" href="{{PRIMARY_HREF}}">{{PRIMARY_LABEL}}</a>
      <a class="button secondary" href="/">Home</a>
    </div>
    {{REFERENCE}}
  </main>
</body>
</html>
