<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Co-speaker invitation · SessionBuddy</title>
  <link rel="stylesheet" href="/product/assets/product.css?v=23">
  <script src="/app-shell/assets/api-client.js?v=2" defer></script>
  <script src="/co-speaker-invitations/assets/invitation.js?v=1" defer></script>
</head>
<body class="public-body invitation-page">
  <a class="skip-link" href="#main">Skip to invitation</a>
  <header class="public-header"><div class="shell app-header__inner"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">S</span><span>SessionBuddy</span></a></div></header>
  <main id="main" class="shell page invitation-shell" tabindex="-1">
    <section class="card auth-card invitation-card" aria-labelledby="invitation-title">
      <p class="eyebrow">Co-speaker invitation</p>
      <h1 id="invitation-title">Review your invitation</h1>
      <div id="status" class="status" role="status" aria-live="polite" tabindex="-1">Loading invitation…</div>
      <div id="invitation-details" hidden>
        <p><strong id="invited-name"></strong>, you have been invited to present <strong id="proposal-title"></strong> at <strong id="event-name"></strong>.</p>
        <p id="invitation-expiry" class="help"></p>
        <div id="invitation-actions" class="actions">
          <button id="decline-invitation" type="button" class="secondary">Decline</button>
          <button id="accept-invitation" type="button">Accept invitation</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
