<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speakers · SessionBuddy</title>
  <link rel="stylesheet" href="/product/assets/product.css?v=57">
  <link rel="stylesheet" href="/app-shell/assets/app-shell.css?v=19">
  <script src="/app-shell/assets/api-client.js?v=2" defer></script>
  <script src="/app-shell/assets/app-shell.js?v=22" defer></script>
  <script src="/admin/speakers/assets/speakers.js?v=7" defer></script>
</head>
<body class="app-body speaker-directory-page">
  <a class="skip-link" href="#main">Skip to speakers</a>
  <header data-auth-shell></header>
  <main id="main" class="shell page speaker-directory-shell" tabindex="-1">
    <div class="page-heading directory-hero">
      <div>
        <h1 id="page-title">Speakers</h1>
        <p id="page-summary" class="lede">One profile per person, with their participation across your events.</p>
      </div>
      <a id="invite-speaker" class="button" href="/admin/events">Choose event to invite</a>
    </div>
    <div data-speaker-hub-tabs></div>
    <div id="status" class="status status-compact" role="status" aria-live="polite">Loading…</div>
    <section id="speaker-detail" class="card speaker-profile-editor" hidden aria-labelledby="speaker-name">
      <p id="speaker-event" class="eyebrow"></p><h2 id="speaker-name"></h2><p id="speaker-proposal" class="lede"></p>
      <div id="speaker-profile-view" class="speaker-profile-view" hidden>
        <p id="speaker-role" class="lede"></p>
        <p id="speaker-location" class="muted"></p>
        <div><h3>About</h3><p id="speaker-biography"></p></div>
        <div><h3>Links</h3><div id="speaker-links" class="actions"></div></div>
        <div><h3>Events and proposals</h3><ul id="speaker-events" class="speaker-participations"></ul></div>
      </div>
      <form id="speaker-form"><input name="version" type="hidden"><div class="form-grid"><label>Name<input name="display_name" maxlength="200" required></label><label>Email<input name="email" type="email" readonly></label><label>Job title<input name="job_title" maxlength="200"></label><label>Company<input name="company" maxlength="200"></label><label>Location<input name="location" maxlength="300"></label><label>Links <span class="optional">One per line</span><textarea name="links" rows="3"></textarea></label></div><label>Biography<textarea name="biography" rows="6" maxlength="5000"></textarea></label><button>Save speaker details</button></form>
      <div class="actions"><a id="speaker-onboarding" class="button" href="#">Open onboarding</a><a id="speaker-directory" class="button secondary" href="/admin/speakers">Back to speakers</a></div>
    </section>
    <section id="speaker-directory-results" class="directory-section speaker-directory-results" aria-labelledby="directory-title">
      <div class="section-heading"><h2 id="directory-title">Speaker profiles</h2><span id="speaker-count" class="badge">—</span></div>
      <form id="speaker-filters" class="filter-bar" role="search">
        <label>Search<input id="speaker-search" type="search" placeholder="Name, email, company, or session"></label>
        <label id="event-filter-field">Event<select id="speaker-event-filter"><option value="">All events</option></select></label>
        <label>Status<select id="speaker-status"><option value="">All statuses</option><option value="invited">Invited</option><option value="submitted">Submitted</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option></select></label>
      </form>
      <div id="speaker-list" class="entity-grid"><p class="empty">Loading speaker directory…</p></div>
    </section>
  </main>
</body>
</html>
