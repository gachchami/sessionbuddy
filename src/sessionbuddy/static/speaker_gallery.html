<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speakers · SessionBuddy</title>
  <link rel="stylesheet" href="/product/assets/product.css?v=91">
  <script src="/app-shell/assets/api-client.js?v=10" defer></script>
  <script src="/public/assets/event-masthead.js?v=89ffbe0accd6" defer></script>
  <script src="/public/assets/biography-disclosure.js?v=b4a25d2ddfb3" defer></script>
  <script src="/gallery/assets/gallery.js?v=5" defer></script>
</head>
<body class="public-body speaker-gallery-page" data-layout="directory">
  <a class="skip-link" href="#main">Skip to speakers</a>
  <header class="public-header"><div class="shell app-header__inner"><a class="brand" href="/"><img class="brand-mark" src="/landing/assets/sessionbuddy-favicon.svg" alt=""><span>SessionBuddy</span></a></div></header>
  <main id="main" class="shell page speaker-gallery-shell" tabindex="-1">
    <div class="gallery-event-branding" data-public-event-masthead></div>
    <div class="speaker-surface-heading"><div><h1>Speakers</h1><p class="lede">Browse the people and sessions shaping this event.</p></div><nav class="speaker-view-switch" aria-label="Speaker view"><a id="speaker-list-link" href="#">List</a><a id="speaker-gallery-link" href="#">Gallery</a></nav></div>
    <section class="gallery-toolbar" aria-label="Find speakers"><p id="status" class="gallery-count" role="status" aria-live="polite">Loading speakers…</p><label id="speaker-search-label">Find a speaker<input id="speaker-search" type="search" placeholder="Name, company, session, or topic"></label></section>
    <section id="speaker-grid" class="speaker-gallery" aria-label="Accepted speakers"></section>
    <section id="empty" class="empty-state" hidden><strong>No speakers have been announced yet.</strong></section>
    <dialog id="speaker-profile" class="speaker-profile-dialog" aria-labelledby="speaker-profile-title"><form method="dialog"><button class="speaker-profile-dialog__close secondary" aria-label="Close speaker profile">Close</button></form><div id="speaker-profile-content"></div></dialog>
  </main>
</body>
</html>
