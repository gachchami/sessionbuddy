<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Speaker home · SessionBuddy</title>
  <link rel="stylesheet" href="/app-shell/assets/app-shell.css?v=19">
  <link rel="stylesheet" href="/speaker/assets/speaker.css?v=20">
  <script src="/app-shell/assets/api-client.js?v=2" defer></script>
  <script src="/app-shell/assets/app-shell.js?v=24" defer></script>
  <script src="/speaker/assets/speaker-portal.js?v=16" defer></script>
</head>
<body class="app-body speaker-portal-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-auth-shell data-allow-guest></header>

  <main id="main" class="shell speaker-portal-shell" tabindex="-1">
    <div id="status" class="status" role="status" aria-live="polite">
      Loading speaker details…
    </div>

    <section id="auth-state" class="state-panel" hidden aria-labelledby="auth-title">
      <h1 id="auth-title">Speaker sign in</h1>
      <p>Use the email address connected to your invitation or proposal.</p>
      <button id="speaker-sign-in" type="button">Sign in</button>
    </section>

    <div id="portal" hidden>
      <header class="portal-hero">
        <div class="portal-hero__copy">
          <p class="portal-hero__eyebrow">Speaker portal</p>
          <h1 class="portal-hero__title">Welcome, <strong id="welcome-name"></strong></h1>
          <p id="event-summary" class="portal-hero__context section-index"></p>
        </div>
        <div class="portal-hero__tools">
          <div class="event-picker">
            <span class="event-picker__label">Viewing event</span>
            <details id="event-menu" class="event-menu">
              <summary aria-label="Choose event" aria-haspopup="menu"><span id="event-current">Choose event</span><span class="event-menu__chevron" aria-hidden="true"></span></summary>
              <div id="event-options" class="event-menu__options" role="menu" aria-label="Events"></div>
            </details>
          </div>
          <a id="public-profile-link" class="portal-hero__profile" href="#" hidden>Public profile</a>
        </div>
      </header>
      <div class="portal-grid">
        <section id="tasks" class="panel portal-priority-panel" aria-labelledby="tasks-title">
          <div class="section-heading">
            <div><h2 id="tasks-title">Actions</h2></div>
            <span id="task-count" class="count-badge">0</span>
          </div>
          <ul id="task-list" class="item-list" aria-describedby="task-help"></ul>
        </section>

        <section id="submissions" class="panel portal-priority-panel" aria-labelledby="submissions-title">
          <div class="section-heading">
            <div><h2 id="submissions-title">Sessions</h2></div>
          </div>
          <ul id="submission-list" class="item-list"></ul>
        </section>

        <details id="resources" class="panel portal-wide-panel secondary-panel">
          <summary><span id="resources-title">Resources</span><span id="resource-count" class="count-badge">0</span></summary>
          <div id="resource-list" class="resource-list"><p class="empty">Loading resources…</p></div>
        </details>

        <section id="notifications" class="panel portal-wide-panel" aria-labelledby="notifications-title">
          <div class="section-heading"><h2 id="notifications-title">Notifications</h2><span id="notification-count" class="count-badge">0</span></div>
          <ul id="notification-list" class="notification-list"></ul>
        </section>

      </div>
    </div>
  </main>
</body>
</html>
